<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财务台账异常项检测工具</title>
<style>
  :root {
    --primary: #1a237e;
    --primary-light: #3949ab;
    --primary-lighter: #5c6bc0;
    --primary-dark: #0d1640;
    --bg: #f5f6fa;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #555;
    --border: #d4d8e8;
    --danger: #c62828;
    --danger-bg: #fce4ec;
    --warning: #f9a825;
    --warning-bg: #fff8e1;
    --success: #2e7d32;
    --success-bg: #e8f5e9;
    --info: #1565c0;
    --info-bg: #e3f2fd;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
    color: #fff;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(26,35,126,0.3);
  }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  .header .subtitle { font-size: 13px; opacity: 0.8; margin-top: 2px; }
  .header .badge {
    background: rgba(255,255,255,0.15);
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 12px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .main-container {
    flex: 1;
    display: flex;
    gap: 20px;
    padding: 20px 32px;
    overflow: hidden;
  }
  .panel {
    background: var(--card-bg);
    border-radius: 10px;
    box-shadow: 0 1px 8px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-left { flex: 1; min-width: 0; }
  .panel-right { flex: 1.5; min-width: 0; }
  .panel-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(180deg, #fafbfe 0%, #f0f2f8 100%);
  }
  .panel-header h2 { font-size: 15px; color: var(--primary); font-weight: 600; }
  .panel-body { padding: 16px 20px; flex: 1; overflow-y: auto; }

  textarea {
    width: 100%;
    min-height: 240px;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 12px;
    line-height: 1.6;
    resize: vertical;
    transition: border-color 0.2s;
    color: var(--text);
    background: #fbfcff;
  }
  textarea:focus { outline: none; border-color: var(--primary-lighter); }

  .hint { font-size: 12px; color: var(--text-secondary); margin-top: 8px; line-height: 1.6; }
  .hint code { background: #eef0f6; padding: 1px 5px; border-radius: 3px; font-size: 11px; color: var(--primary); }

  .btn-group { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    padding: 9px 20px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-light); transform: translateY(-1px); box-shadow: 0 3px 10px rgba(26,35,126,0.3); }
  .btn-secondary { background: #fff; color: var(--primary); border: 1.5px solid var(--primary-lighter); }
  .btn-secondary:hover { background: #eef0fa; }
  .btn-outline { background: #fff; color: var(--text-secondary); border: 1.5px solid var(--border); }
  .btn-outline:hover { background: #f5f5f5; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .stats-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat-card {
    flex: 1; min-width: 110px; padding: 12px 16px; border-radius: 8px; text-align: center;
    border: 1px solid var(--border); background: #fbfcff;
  }
  .stat-card .label { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
  .stat-card .value { font-size: 26px; font-weight: 700; }
  .stat-total .value { color: var(--primary); }
  .stat-anomaly .value { color: var(--danger); }
  .stat-attention .value { color: var(--warning); }
  .stat-dedup .value { color: var(--success); }

  .result-table-wrap { border: 1px solid var(--border); border-radius: 8px; overflow: auto; max-height: 460px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead { position: sticky; top: 0; z-index: 1; }
  th { background: var(--primary); color: #fff; padding: 9px 10px; text-align: left; font-weight: 600; white-space: nowrap; }
  td { padding: 7px 10px; border-bottom: 1px solid #eee; white-space: nowrap; }
  tr:hover td { background: #f8f9fc; }

  .tag { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 600; margin: 1px 1px; white-space: nowrap; }
  .tag-danger { background: var(--danger-bg); color: var(--danger); }
  .tag-warning { background: var(--warning-bg); color: var(--warning); }
  .tag-success { background: var(--success-bg); color: var(--success); }
  .tag-info { background: var(--info-bg); color: var(--info); }

  .ctag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; margin: 1px; white-space: nowrap; border: 1px solid transparent; }
  .ctag-pass { background: var(--success-bg); color: var(--success); border-color: #c8e6c9; }
  .ctag-anomaly { background: var(--danger-bg); color: var(--danger); border-color: #f8bbd0; }
  .ctag-attention { background: var(--warning-bg); color: var(--warning); border-color: #ffe082; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.3; }

  .row-highlight td { background: #fff5f5 !important; }

  .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .filter-btn {
    padding: 4px 12px; border-radius: 16px; border: 1px solid var(--border);
    background: #fff; font-size: 12px; cursor: pointer; color: var(--text-secondary); transition: all 0.15s;
  }
  .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .filter-btn:hover { border-color: var(--primary-lighter); }
</style>
</head>
<body>
  <div class="header">
    <div>
      <h1>财务台账异常项检测工具</h1>
      <div class="subtitle">Financial Ledger Anomaly &amp; Compliance Detector</div>
    </div>
    <div class="badge">v2.0 合规增强版</div>
  </div>

  <div class="main-container">
    <!-- 左栏：数据输入 -->
    <div class="panel panel-left">
      <div class="panel-header"><h2>数据输入区</h2></div>
      <div class="panel-body">
        <textarea id="inputData" placeholder="粘贴台账数据（首行建议为表头），字段间用 Tab 或逗号分隔：&#10;&#10;项目名称&#9;合同金额&#9;供应商&#9;项目编号&#9;计划完成日期&#9;验收单回执&#9;材料提交状态&#9;Worktile项目名称&#9;垫资标识&#9;变更标识&#9;供方类型&#9;工时录入状态&#10;办公设备采购&#9;12,500.00&#9;华为技术有限公司（深圳）&#9;PROJ-2026-001&#9;2026-06-30&#9;已收到&#9;已提交&#9;办公设备采购-WT&#9;否&#9;否&#9;公开招标&#9;已录入&#10;软件许可费用&#9;8900&#9;MICROSOFT CORP&#9;PROJ-2026-002&#9;2026-03-15&#9;未收到&#9;未提交&#9;&#9;否&#9;是&#9;单一来源&#9;未录入&#10;&#10;支持：Tab/逗号/中文逗号分隔；首行表头自动识别并按列名匹配"></textarea>
        <div class="hint">
          数据字段（按列名自动匹配，顺序无关）：<code>项目名称</code> <code>合同金额</code> <code>供应商</code> <code>项目编号</code> <code>计划完成日期</code><br>
          合规字段：<code>验收单回执</code> <code>材料提交状态</code> <code>Worktile项目名称</code> <code>垫资标识</code> <code>变更标识</code> <code>供方类型</code> <code>工时录入状态</code>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="runDetect()">检测异常</button>
          <button class="btn btn-secondary" onclick="loadSample()">示例数据</button>
          <button class="btn btn-outline" onclick="clearAll()">清空</button>
        </div>
      </div>
    </div>

    <!-- 右栏：检测结果 -->
    <div class="panel panel-right">
      <div class="panel-header">
        <h2>检测结果区</h2>
        <button class="btn btn-secondary" id="exportBtn" onclick="exportCSV()" disabled style="padding:6px 16px;font-size:12px;">导出CSV</button>
      </div>
      <div class="panel-body">
        <div id="statsArea" style="display:none;">
          <div class="stats-row">
            <div class="stat-card stat-total"><div class="label">总记录数</div><div class="value" id="statTotal">0</div></div>
            <div class="stat-card stat-anomaly"><div class="label">异常项总数</div><div class="value" id="statAnomaly">0</div></div>
            <div class="stat-card stat-attention"><div class="label">需关注项总数</div><div class="value" id="statAttention">0</div></div>
            <div class="stat-card stat-dedup"><div class="label">去重后记录数</div><div class="value" id="statDedup">0</div></div>
          </div>
          <div class="filter-bar">
            <button class="filter-btn active" onclick="filterResults('all', this)">全部</button>
            <button class="filter-btn" onclick="filterResults('anomaly', this)">仅异常</button>
            <button class="filter-btn" onclick="filterResults('attention', this)">需关注</button>
            <button class="filter-btn" onclick="filterResults('normal', this)">仅正常</button>
            <button class="filter-btn" onclick="filterResults('duplicate', this)">重复项</button>
            <button class="filter-btn" onclick="filterResults('expired', this)">已过期</button>
          </div>
        </div>
        <div id="resultArea">
          <div class="empty-state"><div class="icon">&#128269;</div><div>暂无检测结果，请粘贴数据后点击「检测异常」</div></div>
        </div>
      </div>
    </div>
  </div>

<script>
/* === 财务台账异常项检测工具 v2.0 — JS逻辑 === */

/* === 全局状态 === */
var detectResults = [];
var currentFilter = 'all';

/* === 工具函数 === */
function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* 列名归一化：将各种表头写法统一到标准字段键 */
function normalizeHeader(h) {
  var s = (h || '').trim().toLowerCase()
    .replace(/\s+/g, '')
    .replace(/（/g, '(').replace(/）/g, ')');
  if (s.indexOf('worktile') >= 0) return 'worktileName';
  if (s.indexOf('验收') >= 0) return 'acceptanceReceipt';
  if (s.indexOf('材料') >= 0 && s.indexOf('提交') >= 0) return 'materialStatus';
  if (s.indexOf('垫资') >= 0) return 'advanceFlag';
  if (s.indexOf('变更') >= 0) return 'changeFlag';
  if (s.indexOf('供方') >= 0 || s.indexOf('供应商类型') >= 0) return 'supplierType';
  if (s.indexOf('工时') >= 0) return 'timesheetStatus';
  if (s.indexOf('计划完成') >= 0 || s.indexOf('完成日期') >= 0 || s.indexOf('到期') >= 0) return 'dueDate';
  if (s.indexOf('项目编号') >= 0 || s.indexOf('编号') >= 0) return 'projectNo';
  if (s.indexOf('合同金额') >= 0 || s.indexOf('金额') >= 0) return 'amount';
  if (s.indexOf('供应商') >= 0 || s.indexOf('供方名称') >= 0) return 'supplier';
  if (s.indexOf('项目名称') >= 0 || s.indexOf('名称') >= 0) return 'name';
  if (s.indexOf('project') >= 0) return 'name';
  return '';
}

/* === 数据解析（支持表头按列名匹配） === */
function parseInput(text) {
  if (!text || !text.trim()) return [];
  var lines = text.trim().split(/\r?\n/);
  var headerMap = null; // columnIndex -> fieldKey
  var hasHeader = false;

  // 判断首行是否为表头：若任意一列能被 normalizeHeader 识别为已知字段，则视为表头
  if (lines.length > 0) {
    var firstCells = splitLine(lines[0]);
    var matched = 0;
    var trialMap = [];
    for (var c = 0; c < firstCells.length; c++) {
      var key = normalizeHeader(firstCells[c]);
      trialMap.push(key);
      if (key) matched++;
    }
    if (matched >= 2) {
      hasHeader = true;
      headerMap = trialMap;
    }
  }

  var records = [];
  for (var i = 0; i < lines.length; i++) {
    if (hasHeader && i === 0) continue;
    var raw = lines[i].trim();
    if (!raw) continue;
    var cells = splitLine(raw);
    if (cells.length < 1) continue;

    var rec = { lineNo: i + 1, name: '', amount: '', supplier: '', projectNo: '',
                dueDate: '', acceptanceReceipt: '', materialStatus: '',
                worktileName: '', advanceFlag: '', changeFlag: '',
                supplierType: '', timesheetStatus: '' };

    if (headerMap) {
      // 按表头列名映射
      for (var k = 0; k < cells.length && k < headerMap.length; k++) {
        var fk = headerMap[k];
        if (fk && rec.hasOwnProperty(fk)) {
          rec[fk] = (cells[k] || '').trim();
        }
      }
    } else {
      // 无表头，按固定位置映射前5列
      rec.name = (cells[0] || '').trim();
      rec.amount = (cells[1] || '').trim();
      rec.supplier = (cells[2] || '').trim();
      rec.projectNo = cells[3] ? cells[3].trim() : '';
      rec.dueDate = cells[4] ? cells[4].trim() : '';
    }

    if (!rec.name && !rec.amount && !rec.supplier) continue;
    records.push(rec);
  }
  return records;
}

function splitLine(line) {
  if (line.indexOf('\t') >= 0) return line.split('\t');
  if (line.indexOf(',') >= 0) return line.split(',');
  if (line.indexOf('，') >= 0) return line.split('，');
  if (/\s{2,}/.test(line)) return line.split(/\s{2,}/);
  if (line.indexOf(' ') >= 0) return line.split(' ');
  return [line];
}

/* === 金额格式校验（原逻辑保持不变） === */
function validateAmount(rawAmount) {
  var issues = [];
  var amount = (rawAmount || '').trim();
  if (!amount) return { valid: false, issues: ['金额为空'], normalized: '', displayAmount: '' };

  var allowedPattern = /^[-+]?[\d,]*\.?\d+$/;
  if (!allowedPattern.test(amount)) {
    var illegalChars = amount.replace(/[-+\d,\.]/g, '');
    if (illegalChars) issues.push('含非数字字符: "' + illegalChars + '"');
    else issues.push('格式不规范');
  }

  var noCommaAmount = amount.replace(/,/g, '');
  var commaCount = (amount.match(/,/g) || []).length;
  if (commaCount > 0) {
    var parts = amount.split('.');
    var intPart = parts[0];
    var decimalPart = parts.length > 1 ? parts[1] : '';
    var intClean = intPart.replace(/[-+]/, '');
    var segs = intClean.split(',');
    var validThousands = true;
    if (segs.length > 1) {
      for (var s = 0; s < segs.length; s++) {
        if (s === 0) { if (segs[s].length < 1 || segs[s].length > 3) { validThousands = false; break; } }
        else { if (segs[s].length !== 3) { validThousands = false; break; } }
      }
    }
    if (!validThousands) issues.push('千分位格式不规范');
    if (decimalPart.indexOf(',') >= 0) issues.push('小数部分含逗号');
  }
  if ((amount.match(/\./g) || []).length > 1) issues.push('含多个小数点');

  var normalized = '';
  var displayAmount = amount;
  if (issues.length === 0) {
    normalized = noCommaAmount;
    var numVal = parseFloat(normalized);
    if (!isNaN(numVal)) displayAmount = formatNumber(numVal);
  } else {
    normalized = amount.replace(/[^0-9.\-]/g, '');
  }
  return { valid: issues.length === 0, issues: issues, normalized: normalized, displayAmount: displayAmount };
}

function formatNumber(num) {
  var parts = num.toFixed(2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return parts.join('.');
}

/* === 供应商名称标准化（原逻辑保持不变） === */
function standardizeSupplier(rawSupplier) {
  var original = (rawSupplier || '').trim();
  if (!original) return { standardized: '', changed: false, notes: [] };
  var result = original;
  var notes = [];

  var withoutBrackets = result.replace(/[（(][^（()）]*[)）]/g, '').trim();
  if (withoutBrackets && withoutBrackets !== result) {
    notes.push('去除括号内容');
    result = withoutBrackets;
  }
  var hasUpper = result !== result.toLowerCase() && /[A-Z]{2,}/.test(result);
  if (hasUpper) {
    var titleCased = result.replace(/[A-Za-z]+/g, function(w) { return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); });
    if (titleCased !== result) { notes.push('统一大小写'); result = titleCased; }
  }
  var trimmedSpaces = result.replace(/\s+/g, ' ').trim();
  if (trimmedSpaces !== result) { result = trimmedSpaces; if (notes.indexOf('去除多余空格') < 0) notes.push('去除多余空格'); }
  var noTrailingPunct = result.replace(/[，。,.;；\s]+$/, '');
  if (noTrailingPunct !== result && noTrailingPunct) { result = noTrailingPunct; notes.push('去除末尾标点'); }

  return { standardized: result, changed: result !== original, notes: notes };
}

function makeNameKey(name) {
  return (name || '').trim().toLowerCase().replace(/\s+/g, '').replace(/[（(].*?[)）]/g, '');
}

/* === 日期解析（支持 2026-08-25 / 2026/08/25 / 2026年8月25日 / 20260825） === */
function parseDate(str) {
  if (!str) return null;
  var s = String(str).trim();
  var m = s.match(/^(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})/);
  if (m) {
    var d = new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
    return isNaN(d.getTime()) ? null : d;
  }
  m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if (m) {
    var d2 = new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
    return isNaN(d2.getTime()) ? null : d2;
  }
  var parsed = new Date(s);
  return isNaN(parsed.getTime()) ? null : parsed;
}

/* === 业务合规检测（8项规则） === */
function runComplianceChecks(rec) {
  var checks = [];

  // 1. 验收单回执
  var ar = (rec.acceptanceReceipt || '').trim();
  if (ar === '已收到' || ar === '已签收') checks.push({ code: '验收单', status: 'pass', detail: '已收到' });
  else checks.push({ code: '验收单', status: 'anomaly', detail: ar ? ('状态: ' + ar) : '未收到' });

  // 2. 材料提交状态
  var ms = (rec.materialStatus || '').trim();
  if (ms === '已提交' || ms === '已交') checks.push({ code: '材料', status: 'pass', detail: '已提交' });
  else checks.push({ code: '材料', status: 'anomaly', detail: ms ? ('状态: ' + ms) : '未提交' });

  // 3. Worktile项目名称
  var wn = (rec.worktileName || '').trim();
  if (wn) checks.push({ code: 'Worktile', status: 'pass', detail: wn.length > 12 ? wn.substring(0, 12) + '…' : wn });
  else checks.push({ code: 'Worktile', status: 'anomaly', detail: '未填写' });

  // 4. 垫资标识
  var af = (rec.advanceFlag || '').trim();
  if (af === '是' || af === '需要' || af === '需垫资') checks.push({ code: '垫资', status: 'attention', detail: '需垫资' });
  else checks.push({ code: '垫资', status: 'pass', detail: '否' });

  // 5. 变更标识
  var cf = (rec.changeFlag || '').trim();
  if (cf === '是' || cf === '有变更') checks.push({ code: '变更', status: 'attention', detail: '有变更' });
  else checks.push({ code: '变更', status: 'pass', detail: '否' });

  // 6. 供方类型（单一来源）
  var st = (rec.supplierType || '').trim();
  if (st.indexOf('单一') >= 0 || st.indexOf('独家') >= 0) checks.push({ code: '单一供方', status: 'attention', detail: '单一来源' });
  else checks.push({ code: '单一供方', status: 'pass', detail: st || '—' });

  // 7. 工时录入状态
  var ts = (rec.timesheetStatus || '').trim();
  if (ts === '已录入' || ts.indexOf('已录入') >= 0) checks.push({ code: '工时', status: 'pass', detail: '已录入' });
  else if (ts === '未录入' || ts.indexOf('未录入') >= 0 || !ts) checks.push({ code: '工时', status: 'anomaly', detail: ts ? '未录入' : '未填写' });
  else checks.push({ code: '工时', status: 'pass', detail: ts });

  // 8. 项目到期（计划完成日期 vs 当前日期）
  var dd = (rec.dueDate || '').trim();
  if (!dd) {
    checks.push({ code: '到期', status: 'anomaly', detail: '无完成日期' });
  } else {
    var dueDate = parseDate(dd);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    if (!dueDate) {
      checks.push({ code: '到期', status: 'anomaly', detail: '日期格式异常: ' + dd });
    } else if (dueDate < today) {
      checks.push({ code: '到期', status: 'anomaly', detail: '已过期(' + formatDateShort(dueDate) + ')' });
    } else {
      var daysLeft = Math.ceil((dueDate - today) / 86400000);
      checks.push({ code: '到期', status: 'pass', detail: '剩' + daysLeft + '天' });
    }
  }

  return checks;
}

function formatDateShort(d) {
  var p = function(n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/* 主检测流程占位 — 在下方追加 */

/* === 主检测流程 === */
function runDetect() {
  var text = document.getElementById('inputData').value;
  var records = parseInput(text);
  if (records.length === 0) {
    alert('请先粘贴有效的台账数据（每行一条记录，首行建议为表头）');
    return;
  }

  // 重复检测统计
  var nameCount = {}, nameFirstIndex = {}, i;
  for (i = 0; i < records.length; i++) {
    var key = makeNameKey(records[i].name);
    if (nameCount[key] == null) { nameCount[key] = 0; nameFirstIndex[key] = i; }
    nameCount[key]++;
  }

  detectResults = [];
  for (i = 0; i < records.length; i++) {
    var rec = records[i];
    var issues = [];
    var infoNotes = [];

    // --- 原有检测：金额校验 ---
    var amountResult = validateAmount(rec.amount);
    if (!amountResult.valid) {
      for (var a = 0; a < amountResult.issues.length; a++) {
        issues.push({ type: 'amount', msg: '合同金额异常：' + amountResult.issues[a] });
      }
    }

    // --- 原有检测：重复检测 ---
    var nameKey = makeNameKey(rec.name);
    var isDuplicate = nameCount[nameKey] > 1;
    var isFirstOccurrence = nameFirstIndex[nameKey] === i;
    if (isDuplicate) {
      if (isFirstOccurrence) infoNotes.push({ type: 'duplicate', msg: '重复项（首次出现，共' + nameCount[nameKey] + '条）' });
      else issues.push({ type: 'duplicate', msg: '重复项（与第' + (nameFirstIndex[nameKey] + 1) + '条记录重复）' });
    }

    // --- 原有检测：供应商标准化 ---
    var supplierResult = standardizeSupplier(rec.supplier);
    if (supplierResult.notes.length > 0 && supplierResult.standardized) infoNotes.push({ type: 'supplier', msg: '供应商已标准化' });
    if (!supplierResult.standardized && !rec.supplier) issues.push({ type: 'supplier', msg: '供应商为空' });

    // --- 新增：8项业务合规检测 ---
    var complianceChecks = runComplianceChecks(rec);
    var hasComplianceAnomaly = false;
    var hasComplianceAttention = false;
    for (var ci = 0; ci < complianceChecks.length; ci++) {
      if (complianceChecks[ci].status === 'anomaly') hasComplianceAnomaly = true;
      if (complianceChecks[ci].status === 'attention') hasComplianceAttention = true;
    }

    var hasAnomaly = issues.length > 0 || hasComplianceAnomaly;
    var hasAttention = hasComplianceAttention;

    detectResults.push({
      index: i + 1,
      lineNo: rec.lineNo,
      name: rec.name,
      nameKey: nameKey,
      amount: rec.amount,
      amountDisplay: amountResult.displayAmount,
      amountValid: amountResult.valid,
      supplier: rec.supplier,
      supplierStandardized: supplierResult.standardized,
      supplierChanged: supplierResult.changed,
      projectNo: rec.projectNo,
      dueDate: rec.dueDate,
      isDuplicate: isDuplicate,
      isFirstOccurrence: isFirstOccurrence,
      complianceChecks: complianceChecks,
      issues: issues,
      infoNotes: infoNotes,
      hasAnomaly: hasAnomaly,
      hasAttention: hasAttention
    });
  }

  currentFilter = 'all';
  renderStats();
  renderResults();
  document.getElementById('exportBtn').disabled = false;
}

/* === 统计渲染 === */
function renderStats() {
  var total = detectResults.length;
  var anomalyCount = 0, attentionCount = 0;
  var uniqueKeys = {};
  for (var i = 0; i < detectResults.length; i++) {
    if (detectResults[i].hasAnomaly) anomalyCount++;
    if (detectResults[i].hasAttention) attentionCount++;
    uniqueKeys[detectResults[i].nameKey] = true;
  }
  document.getElementById('statsArea').style.display = 'block';
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statAnomaly').textContent = anomalyCount;
  document.getElementById('statAttention').textContent = attentionCount;
  document.getElementById('statDedup').textContent = Object.keys(uniqueKeys).length;
}

/* === 结果表格渲染 === */
function renderResults() {
  var resultArea = document.getElementById('resultArea');
  var list = getFilteredList();
  if (list.length === 0) {
    resultArea.innerHTML = '<div class="empty-state"><div class="icon">&#128203;</div><div>当前筛选条件下无记录</div></div>';
    return;
  }

  var html = '<div class="result-table-wrap"><table>';
  html += '<thead><tr><th>#</th><th>项目名称</th><th>合同金额</th><th>供应商</th><th>业务合规检测</th><th>状态</th></tr></thead><tbody>';

  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    var rowClass = r.hasAnomaly ? ' class="row-highlight"' : '';

    // 业务合规检测列：8项逐项标签
    var complianceHtml = '';
    for (var ci = 0; ci < r.complianceChecks.length; ci++) {
      var chk = r.complianceChecks[ci];
      var cls = chk.status === 'anomaly' ? 'ctag-anomaly' : (chk.status === 'attention' ? 'ctag-attention' : 'ctag-pass');
      complianceHtml += '<span class="ctag ' + cls + '" title="' + escapeHtml(chk.code + ': ' + chk.detail) + '">' +
                        escapeHtml(chk.code) + ':' + escapeHtml(chk.detail) + '</span> ';
    }

    // 状态列
    var tags = '';
    for (var j = 0; j < r.issues.length; j++) {
      var cls2 = 'tag-danger';
      var txt = r.issues[j].msg;
      if (txt.length > 32) txt = txt.substring(0, 30) + '…';
      tags += '<span class="tag ' + cls2 + '" title="' + escapeHtml(r.issues[j].msg) + '">' + escapeHtml(txt) + '</span>';
    }
    for (var k = 0; k < r.infoNotes.length; k++) {
      var ncls = r.infoNotes[k].type === 'duplicate' ? 'tag-warning' : 'tag-info';
      var ntxt = r.infoNotes[k].msg;
      if (ntxt.length > 32) ntxt = ntxt.substring(0, 30) + '…';
      tags += '<span class="tag ' + ncls + '" title="' + escapeHtml(r.infoNotes[k].msg) + '">' + escapeHtml(ntxt) + '</span>';
    }
    if (tags === '') tags = '<span class="tag tag-success">全部通过</span>';

    // 金额
    var amountCell = escapeHtml(r.amount) || '<span style="color:#999;">—</span>';
    if (!r.amountValid) amountCell = '<span style="color:var(--danger);font-weight:600;">' + amountCell + '</span>';

    // 供应商
    var supplierCell = escapeHtml(r.supplierStandardized) || escapeHtml(r.supplier) || '<span style="color:#999;">—</span>';
    if (r.supplierChanged && r.supplierStandardized) supplierCell = '<span style="color:var(--info);">' + supplierCell + '</span>';

    html += '<tr' + rowClass + '>';
    html += '<td style="color:#999;">' + r.index + '</td>';
    html += '<td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;" title="' + escapeHtml(r.name) + '">' + escapeHtml(r.name) + '</td>';
    html += '<td>' + amountCell + '</td>';
    html += '<td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;" title="' + escapeHtml(r.supplierStandardized) + '">' + supplierCell + '</td>';
    html += '<td style="max-width:340px;white-space:normal;line-height:1.8;">' + complianceHtml + '</td>';
    html += '<td style="max-width:200px;white-space:normal;">' + tags + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  resultArea.innerHTML = html;
}

/* === 筛选逻辑 === */
function getFilteredList() {
  if (currentFilter === 'all') return detectResults;
  var list = [];
  for (var i = 0; i < detectResults.length; i++) {
    var r = detectResults[i];
    if (currentFilter === 'anomaly' && r.hasAnomaly) list.push(r);
    else if (currentFilter === 'attention' && r.hasAttention && !r.hasAnomaly) list.push(r);
    else if (currentFilter === 'normal' && !r.hasAnomaly && !r.hasAttention && !r.isDuplicate) list.push(r);
    else if (currentFilter === 'duplicate' && r.isDuplicate) list.push(r);
    else if (currentFilter === 'expired') {
      for (var j = 0; j < r.complianceChecks.length; j++) {
        if (r.complianceChecks[j].code === '到期' && r.complianceChecks[j].status === 'anomaly') { list.push(r); break; }
      }
    }
  }
  return list;
}

function filterResults(type, btnEl) {
  currentFilter = type;
  var btns = document.querySelectorAll('.filter-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  btnEl.classList.add('active');
  renderResults();
}

/* === CSV 导出 === */
function exportCSV() {
  if (detectResults.length === 0) { alert('没有可导出的数据，请先执行检测'); return; }

  var checkNames = ['验收单', '材料', 'Worktile', '垫资', '变更', '单一供方', '工时', '到期'];
  var header = ['序号', '项目名称', '项目编号', '合同金额', '标准化金额', '供应商', '标准化供应商', '计划完成日期', '是否重复'];
  for (var cn = 0; cn < checkNames.length; cn++) header.push(checkNames[cn]);
  header.push('异常项', '提示项');

  var rows = [header];
  for (var i = 0; i < detectResults.length; i++) {
    var r = detectResults[i];
    var issueText = '';
    for (var j = 0; j < r.issues.length; j++) { if (issueText) issueText += ' | '; issueText += r.issues[j].msg; }
    var noteText = '';
    for (var k = 0; k < r.infoNotes.length; k++) { if (noteText) noteText += ' | '; noteText += r.infoNotes[k].msg; }

    var row = [r.index, r.name, r.projectNo, r.amount, r.amountValid ? r.amountDisplay : '', r.supplier, r.supplierStandardized, r.dueDate, r.isDuplicate ? (r.isFirstOccurrence ? '重复(首次)' : '重复') : ''];
    for (var ci = 0; ci < r.complianceChecks.length; ci++) {
      var chk = r.complianceChecks[ci];
      var st = chk.status === 'pass' ? '通过' : (chk.status === 'anomaly' ? '异常' : '需关注');
      row.push(st + '(' + chk.detail + ')');
    }
    row.push(issueText, noteText);
    rows.push(row);
  }

  var csvContent = rows.map(function(row) {
    return row.map(function(cell) {
      var val = (cell == null) ? '' : String(cell);
      if (/[",\n\r]/.test(val)) val = '"' + val.replace(/"/g, '""') + '"';
      return val;
    }).join(',');
  }).join('\r\n');

  var blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = '财务台账检测结果_' + getTimestamp() + '.csv';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function getTimestamp() {
  var d = new Date();
  var p = function(n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}
